name: qcom-htp-runtime CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Qualcomm debs from public PPA
        run: |
          set -euo pipefail
          # Skip if the exact pinned debs are committed in debs/
          if [ -n "$(ls debs/*.deb 2>/dev/null)" ]; then
            echo "Using pinned debs from repo"
          else
            echo "deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-qcom-iot/qcom-ppa/ubuntu noble main" \
              | sudo tee /etc/apt/sources.list.d/qcom-ppa.list
            sudo apt-get update -qq
            mkdir -p debs && cd debs
            apt-get download qcom-fastrpc1 qcom-libdmabufheap libgomp1
          fi

      - name: Build snap
        uses: canonical/action-build@v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcom-htp-runtime-${{ matrix.arch }}-${{ github.sha }}
          path: qcom-htp-runtime_*.snap
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qcom-htp-runtime-arm64-${{ github.sha }}

      # NOTE: requires the 'qcom-htp-runtime' store name to be registered and
      # the STORE_LOGIN secret (snapcraft export-login output) added to this
      # repo. Until then this job is expected to fail at the publish step.
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Publish to store (edge)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          snap_file="$(ls qcom-htp-runtime_*.snap)"
          snapcraft upload "$snap_file" --release edge
