name: qcom-htp-runtime
version: "2.46.0"
summary: Qualcomm Hexagon HTP runtime provider for inference snaps
description: |
  Runtime content provider implementing the inference-npu-runtime-qcom-htp-v1
  contract. Ships the FastRPC userspace libraries (libcdsprpc, libadsprpc,
  default listeners) required by the Hexagon backend ABI and the QCS8300/QCM6490
  DSP configuration tree that FastRPC reads from the absolute /usr/share/qcom
  path (bound into consumers via a layout).

  The inference-npu custom-device slot itself belongs to the platform gadget
  (see platform-npu-access-spec.md section 3.2); this snap only provides the
  versioned runtime content.

base: core24
confinement: strict
grade: devel
platforms:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

slots:
  inference-npu-runtime-qcom-htp:
    interface: content
    content: inference-npu-runtime-qcom-htp-v1
    read:
      - $SNAP/usr/share/qcom
      - $SNAP/htp-skels
      - $SNAP

layout:
  # FastRPC hardcodes the absolute /usr/share/qcom path for its DSP config.
  /usr/share/qcom:
    bind: $SNAP/usr/share/qcom

parts:
  fastrpc-libs:
    plugin: dump
    source: .
    override-build: |
      set -eo pipefail
      mkdir -p extract
      for d in /root/project/*.deb; do
        [ -e "$d" ] || continue
        dpkg -x "$d" extract/
      done
      mkdir -p "$CRAFT_PART_INSTALL"
      cp -a extract/usr/lib/aarch64-linux-gnu/. "$CRAFT_PART_INSTALL/"
      if [ -d extract/usr/sbin ]; then
        mkdir -p "$CRAFT_PART_INSTALL/bin"
        cp -a extract/usr/sbin/. "$CRAFT_PART_INSTALL/bin/"
      fi
      # llama.cpp dlopen()s "libcdsprpc.so" (unversioned); ship the symlink
      ln -sf libcdsprpc.so.1.0.0 "$CRAFT_PART_INSTALL/libcdsprpc.so"
      ln -sf libadsprpc.so.1.0.0 "$CRAFT_PART_INSTALL/libadsprpc.so"
      find "$CRAFT_PART_INSTALL" -name "*.a" -delete
      find "$CRAFT_PART_INSTALL" -name "*.so" -exec sh -c 'b="${1%.so}"; [ -e "${b}.so.1" ] || [ -e "${b}.so.1.0.0" ] || rm -f "$1"' _ {} \; 2>/dev/null || true
    organize:
      libcdsprpc.so: lib/
      libadsprpc.so: lib/

  dsp-config:
    plugin: dump
    source: dsp-config
    organize:
      "*": usr/share/qcom/

  # HTP skels the llama.cpp Hexagon backend loads by name via
  # ADSP_LIBRARY_PATH (one per Hexagon version). Without these on the DSP
  # path FastRPC session open fails with err 114. Consumed via the
  # inference-npu-runtime-qcom-htp content contract.
  htp-skels:
    plugin: dump
    source: skels
    organize:
      "*": htp-skels/
